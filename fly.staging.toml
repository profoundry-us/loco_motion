# Fly.io config for the STAGING demo site (loco-motion-edge.profoundry.us).
#
# Builds the repo's OWN gem source and deploys every push to `main` via
# .github/workflows/deploy-staging.yml. Live lives in fly.toml.
# Secrets (Algolia, Unsplash, SECRET_KEY_BASE) are Fly secrets.

app = "loco-motion-staging"
primary_region = "dfw"

[build]
  dockerfile = "docs/demo/Dockerfile.fly"

  [build.args]
    LOCO_SOURCE = "path"

[deploy]
  # Reindex Algolia for this version (was the Heroku release phase).
  release_command = "bin/reindex_algolia"

[env]
  ALGOLIA_ENV = "staging"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/up"
    # Rails force_ssl would otherwise redirect Fly's plain-HTTP check.
    headers = { X-Forwarded-Proto = "https" }

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
