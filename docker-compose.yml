services:

  dev:
    build:
      context: .
      dockerfile: dev/Dockerfile.dev
    volumes:
      - .:/home/loco_motion
    tty: true
    stdin_open: true

  loco:
    build:
      context: .
      dockerfile: Dockerfile
    # We should NOT need access to the env_file here, if you think you do, you
    # probably want to move things into the demo app!
    volumes:
      - .:/home/loco_motion
    tty: true
    stdin_open: true

  demo:
    build:
      context: docs/demo
      dockerfile: Dockerfile.demo
    environment:
      # Local dev runs the repo's own source: select the path-based Gemfile
      # pair. The canonical Gemfile installs the PUBLISHED gem for the
      # staging/production builds (issue #365).
      BUNDLE_GEMFILE: Gemfile.dev
    env_file:
      - path: docs/demo/.env.local
        required: false
    volumes:
      - ./docs/demo:/home/loco_demo
      - .:/home/loco_demo/vendor/loco_motion-rails
      - .:/home/loco_motion
    ports:
      - 3000:3000
      - 8080:8080
    tty: true
    stdin_open: true

  yard:
    build:
      context: .
      dockerfile: docs/yard/Dockerfile.yard
    volumes:
      - .:/home/loco_motion
    ports:
      - 8808:8808
    tty: true
    stdin_open: true
