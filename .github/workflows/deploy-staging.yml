# Deploys the staging demo site (loco-motion-demo-staging.profoundry.us) on
# Fly.io from `main`, once CI-CD passes for the pushed commit. Staging runs
# the repo's own gem source (LOCO_SOURCE=path in fly.staging.toml), so it
# always shows the next, unreleased version.
name: Deploy Staging

on:
  workflow_run:
    workflows: [CI-CD]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy -c fly.staging.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
