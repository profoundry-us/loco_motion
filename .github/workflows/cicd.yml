name: CI-CD
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
    - main
    # Deploy Staging (main) and Deploy Live (stable) run off this workflow's
    # completion, so both branches must produce CI runs.
    - stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - run: bundle exec rspec spec

  demo-rspec:
    runs-on: ubuntu-latest
    # CI tests the repo's own source: use the path-based Gemfile pair. The
    # canonical Gemfile installs the published gem (issue #365).
    env:
      BUNDLE_GEMFILE: Gemfile.dev
    steps:
    - uses: actions/checkout@v7

    - name: Create symlink to LocoMotion gem directory
      run: |
        mkdir -p docs/demo/vendor
        ln -sf $(pwd) docs/demo/vendor/loco_motion-rails

    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
        working-directory: docs/demo

    - name: Setup database
      run: bin/rails db:migrate
      working-directory: docs/demo
      env:
        RAILS_ENV: test

    - name: Run RSpec tests in demo app
      run: bundle exec rspec spec
      working-directory: docs/demo

  rubocop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - run: bundle exec rubocop
